name: Build and Upload GNOME Extension

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Package extension
        id: package
        uses: murar8/gnome-extensions-action@0.1.1
        with:
          source-dir: .
          output-dir: ./build
          extra-source: |
            api.js
            attachment-downloader.js
            history-dialog.js
            indicator.js
            notification-store.js
            subscription-manager.js
            utils.js
            LICENSE
            icons

      - name: Verify zip contains all required files
        shell: bash
        run: |
          python3 - "${{ steps.package.outputs.zip-file }}" <<'EOF'
          import sys, zipfile
          req = {
              "metadata.json", "extension.js", "prefs.js", "stylesheet.css",
              "api.js", "attachment-downloader.js", "history-dialog.js",
              "indicator.js", "notification-store.js", "subscription-manager.js",
              "utils.js", "LICENSE",
              "schemas/org.gnome.shell.extensions.ntfy-indicator.gschema.xml",
              "icons/ntfy.svg",
          }
          root_allowed = {
              "metadata.json", "extension.js", "prefs.js", "stylesheet.css",
              "api.js", "attachment-downloader.js", "history-dialog.js",
              "indicator.js", "notification-store.js", "subscription-manager.js",
              "utils.js", "LICENSE",
          }
          with zipfile.ZipFile(sys.argv[1]) as z:
              names = set(z.namelist())
          missing = sorted(req - names)
          stray_root = sorted(n for n in names if "/" not in n and n not in root_allowed)
          if missing:
              print(f"::error::Missing files in zip: {missing}")
              sys.exit(1)
          if stray_root:
              print(f"::error::Unexpected files at zip root: {stray_root}")
              sys.exit(1)
          print(f"zip verification OK: {len(names)} entries, all required files present")
          EOF

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ntfy-indicator@rghvdberg
          path: ${{ steps.package.outputs.zip-file }}
          if-no-files-found: error

      - name: Attach zip to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip-file }}

  upload-ego:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package and Upload to extensions.gnome.org
        uses: murar8/gnome-extensions-action@0.1.1
        with:
          source-dir: .
          username: ${{ secrets.GNOME_USERNAME }}
          password: ${{ secrets.GNOME_PASSWORD }}
          accept-tos: true
          extra-source: |
            api.js
            attachment-downloader.js
            history-dialog.js
            indicator.js
            notification-store.js
            subscription-manager.js
            utils.js
            LICENSE
            icons